<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Static-hosting CSP. Host sources without a scheme follow the page scheme: https on GitHub Pages, http on local serve.py. -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self'; script-src 'self' dapi.kakao.com *.daumcdn.net t1.kakaocdn.net; connect-src 'self' dapi.kakao.com *.daumcdn.net t1.kakaocdn.net rv.map.kakao.com; img-src 'self' data: *.daumcdn.net *.kakaocdn.net; style-src 'self' 'unsafe-inline' *.daumcdn.net; font-src 'self' *.daumcdn.net; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Replaced at deploy time; never commit a real key. See docs/roadview-setup.md. -->
  <meta name="kakao-js-key" content="__KAKAO_JS_KEY__">
  <title>Déjà Vroom Roadview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #121925; color: #fff; }
    * { box-sizing: border-box; }
    html, body, #roadview { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }
    #roadview { min-height: 180px; background: #1d2939; }
    #status { position: fixed; z-index: 2; top: 12px; left: 12px; max-width: calc(100% - 24px); padding: 9px 12px; border-radius: 10px; background: #101827e8; color: #f3f6fc; font-size: 13px; }
    #attribution { position: fixed; z-index: 2; right: 8px; bottom: 8px; padding: 4px 7px; border-radius: 5px; background: #101827bf; color: white; font-size: 10px; }
    #legend { position: fixed; z-index: 2; left: 8px; bottom: 8px; display: flex; gap: 12px; padding: 7px 10px; border-radius: 7px; background: #101827df; color: white; font-size: 12px; }
    #legend[hidden] { display: none; }
    #autodrive { position: fixed; z-index: 4; left: 12px; bottom: 12px; min-height: 44px; padding: 10px 16px; border: 1px solid #5f7396; border-radius: 12px; background: #101827e8; color: #f3f6fc; font: 600 14px/1 system-ui, sans-serif; }
    #autodrive[hidden] { display: none; }
    #segment-context { position: fixed; z-index: 5; top: 12px; right: 12px; width: min(340px, calc(100% - 24px)); padding: 13px 16px; border: 1px solid #79b7ff; border-radius: 14px; background: #07172beF; box-shadow: 0 4px 18px #0008; }
    #segment-context[hidden] { display: none; }
    #context-eyebrow { color: #8dbdff; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    #lane-title { margin-top: 5px; font-size: 16px; font-weight: 750; }
    #lane-subtitle { margin-top: 5px; color: #c4d2e4; font-size: 12px; line-height: 1.45; }
    #lane-list { display: flex; gap: 5px; margin-top: 10px; }
    .lane-slot { display: grid; flex: 1; min-height: 50px; place-items: center; border: 1px solid #6c7888; border-radius: 7px; color: #aab7c8; font-size: 20px; }
    .lane-slot.valid { border: 2px solid #50e0a1; background: #087b4b; color: white; box-shadow: 0 0 12px #50e0a188; }
    .lane-data-missing { margin-top: 9px; color: #ffd27a; font-size: 12px; font-weight: 700; }
    /* Thumbnail mode (?thumb=1): a still Kakao Roadview inside a summary card; the card handles taps. */
    body.thumbnail #status, body.thumbnail #legend, body.thumbnail #autodrive, body.thumbnail .firstlook-candidate-label, body.thumbnail #segment-context { display: none !important; }
    body.thumbnail { position: relative; }
    body.thumbnail #roadview { pointer-events: none; }
    /* Kakao draws its zoom/compass control at the right edge and offers no switch for it. A still card has no
       use for it, so the panorama is laid out wider than the card and the control falls outside the clipped page. */
    body.thumbnail #roadview { width: calc(100% + 120px); }
    body.thumbnail.failed #roadview { display: none; }
    body.thumbnail #status.thumbnail-error { display: grid !important; position: relative !important; top: auto; left: auto; right: auto; bottom: auto; transform: none; width: calc(100% - 24px); min-height: 64px; height: auto; max-width: none; place-items: center; margin: 110px auto 0; padding: 12px; text-align: center; line-height: 19px; border-radius: 10px; background: #26364a; }
    @media (max-height: 200px) { body.thumbnail #status.thumbnail-error { min-height: 56px; margin-top: 36px; padding: 8px; font-size: 11px; line-height: 15px; } }
    .legend-keep { color: #70e4a0; }
    .legend-trap { color: #ff8f8f; }
    .legend-caution { color: #ffc078; }
    .firstlook-route-chevron { color: #1684ff; font: 700 28px/1 system-ui, sans-serif; text-shadow: 0 0 3px #fff, 0 1px 7px #001d55; pointer-events: none; user-select: none; }
    .firstlook-junction-mark { display: grid; width: 22px; height: 22px; place-items: center; border: 1.5px solid #fff; border-radius: 50%; color: #fff; font: 800 15px/1 system-ui, sans-serif; text-shadow: 0 1px 3px #111; box-shadow: 0 1px 5px #111; pointer-events: none; user-select: none; }
    .firstlook-junction-mark.keep { background: #148746; }
    .firstlook-junction-mark.trap { background: #bf2b2b; }
    .firstlook-junction-mark.caution { width: 24px; height: 24px; border-radius: 7px; background: #ad3418; font-size: 15px; }
    .firstlook-candidate-label { position: fixed; z-index: 2; left: 12px; bottom: 12px; max-width: calc(100% - 24px); padding: 9px 12px; border-radius: 10px; background: #101827e8; color: #f3f6fc; font-size: 13px; }
  </style>
</head>
<body>
  <div id="roadview" aria-label="Kakao Roadview"></div>
  <div id="status" role="status">Kakao Roadview를 준비하고 있습니다.</div>
  <section id="segment-context" aria-live="polite" hidden>
    <div id="context-eyebrow">이 지점</div>
    <div id="lane-title"></div>
    <div id="lane-subtitle"></div>
    <div id="lane-list"></div><div id="lane-data-missing" class="lane-data-missing" hidden></div>
  </section>
  <div id="legend" hidden><span class="legend-keep">● 권장 경로</span><span class="legend-trap">● 다른 갈래</span><span class="legend-caution">! 분기 주의</span></div>
  <button id="autodrive" type="button" hidden>분기점까지 다시 보기</button>
  <div id="attribution">Kakao Maps</div>
  <script src="roadview.js"></script>
</body>
</html>
