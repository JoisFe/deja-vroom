name: 버그
description: 앱이 기대와 다르게 동작해요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 순서
      description: Virtual Console 조작(Gear, ACCEL, Steering, Turn Signal, TBT 주입)을 순서대로 적어 주세요
      placeholder: |
        1. Gear P, 목적지 설정
        2. ACCEL 60, TBT 좌회전 1,000 m
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: Pleos Connect Emulator 2.1.0 / API 34 / 앱 커밋 SHA
  - type: textarea
    id: logs
    attributes:
      label: 로그·스크린샷
      description: 위치·VIN 같은 개인정보는 지워 주세요
